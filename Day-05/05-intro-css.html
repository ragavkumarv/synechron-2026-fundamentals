<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Internal CSS -->
    <style>
      /* Element selector */
      h1 {
        color: purple;
        text-align: center;
      }

      /* .Class selector */
      .special {
        font-size: 20px;
        font-family: Verdana, Geneva, sans-serif;
        color: plum;
      }

      .fun {
        text-transform: uppercase;
      }

      h2 {
        font-weight: 400;
      }

      .highlight {
        color: crimson;
        background: pink;
      }

      .profile {
        border-radius: 20px 100px;
      }
    </style>
  </head>
  <body>
    <h1>Hello, <span class="highlight">CSS</span></h1>

    <h2 class="special fun">Hello, 🌏</h2>

    <p class="special">
      Lorem ipsum<span class="highlight">
        dolor sit amet consectetur adipisicing elit.</span
      >
      Ullam officiis, nihil voluptatibus pariatur doloremque repellendus minus
      consequatur ab rem ex, aliquid mollitia? Ducimus distinctio iure incidunt
      numquam nesciunt iste eveniet.
    </p>

    <p class="fun">We are learning 🎉🎉</p>

    <img
      class="profile"
      src="https://i.etsystatic.com/31548528/r/il/ffde13/5804742914/il_300x300.5804742914_ap2d.jpg"
      alt=""
    />
  </body>
</html>
