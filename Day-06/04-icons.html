<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--
     vh - view port height - 1vh -> 1% of screen height 
     vw - view port width - 1vw -> 1% of screen width 
    -->
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-content: center;
      }

      .hobbies {
        color: purple;
      }
    </style>
  </head>
  <body>
    <ul class="hobbies">
      <li><i class="fa-solid fa-chess"></i>Chess</li>
      <li><i class="fa-solid fa-baseball-bat-ball"></i> Cricket</li>
      <li>🕹️ Gaming</li>
      <li><i class="fa-solid fa-table-tennis-paddle-ball"></i> Table Tennis</li>
      <li>Reading</li>
    </ul>
  </body>
</html>
