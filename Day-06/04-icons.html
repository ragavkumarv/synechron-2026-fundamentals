<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--
     vh - view port height - 1vh -> 1% of screen height 
     vw - view port width - 1vw -> 1% of screen width 
    -->
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-content: center;
      }

      .hobbies {
        color: purple;
        list-style: none;
      }

      /* Combinators >, <space>, ~, + */
      /* > - child */

      /* selector1 > selector2 */

      /* li which are child of hobbies */
      /* li { */

      .hobbies > li {
        /* border: 2px solid orange; */
        margin-bottom: 8px;
      }

      /* nth-child selector */

      /* .hobbies > li:nth-child(odd) {
        color: orange;
      } */

      /* first child */

      /* AP - a + nd   0 -> Infinity */
      /* 2 5 8 11 */
      .hobbies > li:nth-child(3n + 2) {
        color: orange;
        /* text-transform: uppercase; */
      }

      /* 
      .hobbies > li:nth-child(2) {
        color: pink;
      }

      .hobbies > li:nth-child(3) {
        color: crimson;
      }

      .hobbies > li:nth-child(4) {
        color: plum;
      }
      .hobbies > li:nth-child(5) {
        color: skyblue;
      } */

      /* AP - a + nd   0 -> Infinity */
      /* 3 7 11 15... -> 4 */

      /* .fa-chess{
        color: crimson
      }

       .fa-playstation{
        color: crimson
      } */

      /* 
      selector1, selector2, selector3{
        common styles
      }  
    */

      .hobbies > li:nth-child(4),
      .hobbies > li:nth-child(5) {
        color: skyblue;
      }

      /* 
      .hobbies > li:nth-child(5) {
        color: skyblue;
      }  
         */

      .fa-chess,
      .fa-playstation {
        color: crimson;
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <ul class="hobbies">
      <li><i class="fa-solid fa-chess"></i>Chess</li>
      <li><i class="fa-solid fa-baseball-bat-ball"></i> Cricket</li>
      <li><i class="fa-brands fa-playstation"></i> Gaming</li>
      <li><i class="fa-solid fa-table-tennis-paddle-ball"></i> Table Tennis</li>
      <li><i class="fa-solid fa-book-open"></i>Reading</li>
      <li><i class="fa-solid fa-table-tennis-paddle-ball"></i> Table Tennis</li>
      <li><i class="fa-solid fa-book-open"></i>Reading</li>
      <li><i class="fa-solid fa-chess"></i>Chess</li>
      <li><i class="fa-solid fa-baseball-bat-ball"></i> Cricket</li>
      <li><i class="fa-brands fa-playstation"></i> Gaming</li>
      <li><i class="fa-solid fa-table-tennis-paddle-ball"></i> Table Tennis</li>
      <li><i class="fa-solid fa-book-open"></i>Reading</li>
      <li><i class="fa-solid fa-table-tennis-paddle-ball"></i> Table Tennis</li>
      <li><i class="fa-solid fa-book-open"></i>Reading</li>
    </ul>

    <ul>
      <li>Chennai</li>
      <li>Tokyo</li>
      <li>Newyork</li>
    </ul>
  </body>
</html>
