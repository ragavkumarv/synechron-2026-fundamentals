<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: oklch(0.16 0.06 26.49);
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .poster-container {
        color: white;
        /* background: orange; */
        max-width: 370px;
        text-align: center;
      }

      /* 1% -> 1% of container size */
      .poster {
        width: 100%;
        height: 500px;

        /* zoomed in */
        object-fit: cover;

        border-radius: 16px;

        /* zoomed out */
        /* object-fit: contain; */
      }

      pre {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="poster-container">
      <img
        class="poster"
        src="https://onlookersmedia.in/wp-content/uploads/2021/06/beast-full-hd-poster-2.jpg"
        alt=""
      />
      <h1>Beast</h1>
      <p>2022 ‧ Action/Dark comedy ‧ 2h 38m</p>
      <p>
        Beast is an upcoming Indian Tamil-language action thriller film written
        and directed by Nelson and produced by Sun Pictures. The film stars
        Vijay and Pooja Hegde, while Selvaraghavan, Yogi Babu and Redin Kingsley
        play supporting roles
      </p>
    </div>

    <!-- <img src="./beast.png" alt="" /> -->
  </body>
</html>
