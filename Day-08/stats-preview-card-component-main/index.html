<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Stats preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      /* Point to HTML */

      /* primary 70%  secondary 25% accent 5% */

      :root {
        --primary-bg-clr: hsl(233, 47%, 7%);
        --card-bg-clr: hsl(244, 37%, 16%);
        --accent-clr: hsl(277, 64%, 61%);

        --primary-text-clr: hsl(0, 0%, 100%);
        --secondary-text-clr: hsla(0, 0%, 100%, 0.5);

        --stats-heading-clr: hsla(0, 0%, 100%, 0.45);

        --primary-ff: Inter, sans-serif;
        --secondary-ff: "Lexend Deca", sans-serif;

        --fw-1: 400;
        --fw-2: 700;

        --primary-font-sz: 15px;
      }

      p {
        color: var(--purple-clr);
      }

      body {
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;

        background: var(--primary-bg-clr);
      }

      .social-card-container {
        background: var(--card-bg-clr);
        color: var(--primary-text-clr);

        font-family: var(--primary-ff);

        text-align: center;

        font-size: var(--primary-font-sz);

        /* 1rem - 16px */
        max-width: 50rem;
        border-radius: 1rem;
        margin: 0rem 2rem;

        overflow: hidden;
      }

      .card-title > span {
        color: var(--accent-clr);
      }

      .card-summary {
        color: var(--secondary-text-clr);

        line-height: 1.5;
        font-weight: 300;
      }

      .stats-container p {
        color: var(--stats-heading-clr);
        text-transform: uppercase;
        font-size: 12px;

        font-family: var(--secondary-ff);

        margin-top: 0px;
      }

      .stats-container h3 {
        margin-bottom: 4px;
      }

      .content-container {
        padding: 2rem;
      }

      .image-container {
        background: url("images/image-header-desktop.jpg"), var(--accent-clr);
        background-blend-mode: luminosity;
        height: 15rem;

        /* zoom in */
        background-size: cover;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body>
    <section class="social-card-container">
      <div class="image-container"></div>
      <div class="content-container">
        <h2 class="card-title">
          Get <span>insights</span> that help your business grow.
        </h2>
        <p class="card-summary">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>
        <div class="stats-container">
          <div>
            <h3>10k+</h3>
            <p>companies</p>
          </div>
          <div>
            <h3>314</h3>
            <p>templates</p>
          </div>
          <div>
            <h3>12M+</h3>
            <p>queries</p>
          </div>
        </div>
      </div>
    </section>

    <!-- <img src="./design/mobile-design.jpg" alt="" /> -->
  </body>
</html>

<!-- 
1. Hold alt & select - multi cursor
2. ctrl + shift + p 
3. Wrap (command)
4. Type your tag
-->
