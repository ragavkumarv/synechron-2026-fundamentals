<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: pink;
        margin: 0px;
        display: grid;
        place-content: center;
        min-height: 100vh;
        gap: 4px;
      }

      button {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <!-- Event listener - onclick, onInput, onChange - 'on' start -->
    <!-- Event happens -> Action Taken | Click -> Start() 
    -->
    <button onclick="start()">Start ▶️</button>
    <button onclick="pause()">Pause ⏸️</button>
    <button onclick="stop()">Stop ⏹️</button>
    <script>
      const colors = ["crimson", "orange", "teal", "pink"];

      let index = 0;
      let colorInterval;

      function start() {
        console.log("Starting....");
        //   Task -  Every 2s body color must change and then cycle

        colorInterval = setInterval(() => {
          // reset
          if (index == colors.length) {
            index = 0;
          }

          console.log(index, colors[index]);

          document
            .querySelector("body") // Select body Where style = 'Background: orange'
            .setAttribute("style", `background: ${colors[index]}`);
          index++;
        }, 2000);
      }

      function stop() {
        console.log("Stopping...");
        clearInterval(colorInterval);
        index = 0;
      }

      function pause() {
        console.log("Pausing...");
        clearInterval(colorInterval);
      }

      //   Task
      //   Start -> Stop -> Start (Start from first color)
    </script>
  </body>
</html>
